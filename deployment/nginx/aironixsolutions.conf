# ==============================================================================
# Nginx Reverse Proxy Configuration — Aditya Air Compressors (aironixsolutions.com)
#
# Domains:
#   1. www.aironixsolutions.com / aironixsolutions.com -> Frontend (port 3000)
#   2. admin.aironixsolutions.com                       -> Admin Panel (port 3001)
#   3. api.aironixsolutions.com                         -> Backend API (port 5000)
# ==============================================================================

# ── Upstream Definitions ──────────────────────────────────────────────────────
upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream admin_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream backend_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── HTTP -> HTTPS Global Redirect ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aironixsolutions.com www.aironixsolutions.com admin.aironixsolutions.com api.aironixsolutions.com;
    
    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 1. Storefront: www.aironixsolutions.com ──────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aironixsolutions.com www.aironixsolutions.com;

    ssl_certificate /etc/letsencrypt/live/aironixsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aironixsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ── 2. Admin Panel: admin.aironixsolutions.com ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.aironixsolutions.com;

    ssl_certificate /etc/letsencrypt/live/aironixsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aironixsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers (Deny framing for Admin panel)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── 3. Backend API: api.aironixsolutions.com ──────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aironixsolutions.com;

    ssl_certificate /etc/letsencrypt/live/aironixsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aironixsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload limit (15MB for product photos)
    client_max_body_size 15M;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
